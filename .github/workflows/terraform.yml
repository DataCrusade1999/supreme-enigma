# Terraform in CI (#339, docs/superpowers/specs/2026-10-02-terraform-ci-design.md).
# PRs plan, pushes apply, a plan that deletes or replaces anything stops for a
# manual `apply-destroys` run, and a weekly plan files drift as an issue. Each branch
# applies its own env stack; dev also applies `shared`, first (#345).
# One job per event: GitHub bills each job rounded up to a minute (#320).
# Never upload or print a plan's JSON — it holds sensitive values in plain text.
name: Terraform

on:
  pull_request:
    branches: [dev, stage, main]
    paths: ["infra/**", ".github/workflows/terraform.yml", ".github/scripts/tf-summary.mjs", ".github/scripts/tf-apply.sh", ".github/scripts/tf-stacks.sh", ".github/scripts/tf-as.sh"]
  push:
    branches: [dev, stage, main]
    paths: ["infra/**", ".github/workflows/terraform.yml", ".github/scripts/tf-summary.mjs", ".github/scripts/tf-apply.sh", ".github/scripts/tf-stacks.sh", ".github/scripts/tf-as.sh"]
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      stack:
        description: "Stack to apply from this branch, or drift"
        required: true
        type: choice
        options: [envs/stage, envs/main, shared, nonprod/dev/account, nonprod/dev/env, drift]
      confirm:
        description: "Type apply-destroys to apply a plan that deletes or replaces resources"
        required: false
        default: ""

permissions: {}

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
  TF_VAR_vercel_api_token: ${{ secrets.TF_VAR_VERCEL_API_TOKEN }}
  TF_VAR_app_password: ${{ secrets.TF_VAR_APP_PASSWORD }}
  TF_VAR_openrouter_api_key: ${{ secrets.TF_VAR_OPENROUTER_API_KEY }}
  TF_VAR_google_client_secret: ${{ secrets.TF_VAR_GOOGLE_CLIENT_SECRET }}
  TF_VAR_github_repo: ${{ vars.TF_VAR_GITHUB_REPO }}
  TF_VAR_alert_email: ${{ vars.TF_VAR_ALERT_EMAIL }}
  TF_VAR_google_client_id: ${{ vars.TF_VAR_GOOGLE_CLIENT_ID }}

jobs:
  plan:
    # Dependabot's runs get neither these secrets nor an OIDC token. Its Terraform
    # bumps land through an owner-opened batch PR (merging-a-pr skill), which is planned.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    concurrency:
      group: terraform-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.1
          terraform_wrapper: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ hashFiles('infra/**/.terraform.lock.hcl') }}
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - name: Lint
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform fmt -check -recursive infra/
          tflint --chdir=infra --init --config="$GITHUB_WORKSPACE/infra/.tflint.hcl"
          tflint --chdir=infra --recursive --config="$GITHUB_WORKSPACE/infra/.tflint.hcl"
      - name: Plan
        id: plan
        env:
          BASE: ${{ github.base_ref }}
        run: |
          mkdir -p plans
          for stack in $(bash .github/scripts/tf-stacks.sh plan); do
            mkdir -p "plans/$stack"
            echo "::group::$stack"
            # Each stack plans under its own role (tf-stacks.sh role).
            tf="bash .github/scripts/tf-as.sh $stack plan terraform -chdir=infra/$stack"
            $tf init -lockfile=readonly
            $tf validate
            # One retry: Vercel's framework-list endpoint times out now and then.
            $tf plan -lock=false -out=tfplan \
              || { sleep 15; $tf plan -lock=false -out=tfplan; }
            $tf show -json tfplan > "plans/$stack/plan.json"
            $tf show -no-color tfplan > "plans/$stack/plan.txt"
            echo "::endgroup::"
          done
      # No Trivy step here: the `test` job in deploy.yml scans infra/*.tf on every PR.
      # Posted on every run that was not cancelled, so the comment always describes
      # the head commit: a failed lint or plan replaces the previous plan (and any ⚠
      # line in it) with what this run got, marked incomplete.
      - name: Comment
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLAN: ${{ steps.plan.outcome }}
          BASE: ${{ github.base_ref }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Terraform plan — \`${HEAD_SHA::7}\`"
          if [ "$PLAN" != success ]; then
            title="$title — ❌ incomplete: lint or plan failed, and a stack missing below was not planned ([run]($RUN))"
          fi
          if [ "$BASE" != dev ]; then
            title="$title — \`shared\` is applied from \`dev\` and not planned here; a \`shared\` change in this PR applies only once it is on \`dev\`"
          fi
          mkdir -p plans
          node .github/scripts/tf-summary.mjs comment plans "$title" > comment.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- terraform-plan -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md >/dev/null
          fi

  apply:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.stack != 'drift')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: terraform-apply-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Stacks run in the order tf-stacks.sh gives (`shared` first, on dev only), each
      # under its own role via tf-as.sh. Routing and its tests: .github/scripts/tf-stacks.*
      - name: Resolve stacks
        id: stacks
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          INPUT: ${{ inputs.stack }}
        run: bash .github/scripts/tf-stacks.sh resolve >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.1
          terraform_wrapper: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ hashFiles('infra/**/.terraform.lock.hcl') }}
      - name: Apply ${{ steps.stacks.outputs.stacks }}
        env:
          CONFIRM: ${{ inputs.confirm }}
          STACKS: ${{ steps.stacks.outputs.stacks }}
        run: |
          for s in $STACKS; do
            bash .github/scripts/tf-as.sh "$s" apply bash .github/scripts/tf-apply.sh "$s"
          done

  drift:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stack == 'drift')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      issues: write
    concurrency:
      group: terraform-drift
      cancel-in-progress: false
    steps:
      # The plan roles trust only PRs and dev (where the schedule runs). The job checks
      # out each branch itself, so the ref it was dispatched from does not matter.
      - name: Require dev
        if: github.ref_name != 'dev'
        run: |
          echo "::error::Dispatch drift from dev: gh workflow run terraform.yml --ref dev -f stack=drift"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: main, path: main }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: stage, path: stage }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: dev, path: dev }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.1
          terraform_wrapper: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ hashFiles('main/infra/**/.terraform.lock.hcl') }}
      - name: Plan every stack from the branch that applies it
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR" plans
          drift=0
          for pair in $(bash dev/.github/scripts/tf-stacks.sh drift); do
            branch=${pair%%:*}; stack=${pair#*:}
            mkdir -p "plans/$stack"
            echo "::group::$stack ($branch)"
            tf="bash dev/.github/scripts/tf-as.sh $stack plan terraform -chdir=$branch/infra/$stack"
            $tf init -lockfile=readonly
            set +e
            $tf plan -lock=false -detailed-exitcode -out=tfplan
            rc=$?
            set -e
            echo "::endgroup::"
            [ $rc -eq 1 ] && { echo "::error::plan failed for $stack"; exit 1; }
            [ $rc -eq 2 ] && drift=1
            $tf show -json tfplan > "plans/$stack/plan.json"
            $tf show -no-color tfplan > "plans/$stack/plan.txt"
          done
          echo "drift=$drift" >> "$GITHUB_ENV"
      - name: File or close the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node dev/.github/scripts/tf-summary.mjs comment plans "Drift check — $RUN" > drift.md
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label drift --state open --json number --jq '.[0].number // empty')
          if [ "$drift" = 1 ]; then
            if [ -n "$issue" ]; then gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file drift.md
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "chore(infra): drift detected" --label drift --label "area: infra" --body-file drift.md; fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "No drift as of $RUN."
          fi

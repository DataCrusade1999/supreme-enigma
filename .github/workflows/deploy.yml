name: CI/CD

on:
  push:
    branches: [main, dev, stage]
  # A PR that changes only docs gets no run at all: nothing in the test job
  # reads these files, and in September 50 of the 180 commits on dev were
  # docs-only. Not applied to `push`: a push to main has to reach `release`.
  # `promotion-guard` lives in its own workflow so this filter cannot skip it.
  pull_request:
    branches: [dev, stage, main]
    paths-ignore:
      - "docs/**"
      - ".claude/**"
      - "**.md"
  workflow_dispatch: {}

# A new push to a PR cancels the run it supersedes. Push runs are keyed on
# the SHA so no push run is ever cancelled, and two pushes never share a
# group: cancelling one could kill `deploy` mid update-function-code or
# `release` between the changelog commit and the tag. A `workflow_dispatch`
# on a SHA that is also being pushed does share the group and waits its turn
# - queued, not cancelled, which is the safe direction.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every `runs-on` below pins `ubuntu-24.04` rather than `ubuntu-latest`.
# `ubuntu-latest` resolves to 24.04 today, so the pin is behaviour-neutral,
# but the label migrates to Ubuntu 26.04 starting 2026-10-19
# (https://github.com/actions/runner-images/issues/14748) and every job was
# emitting a migration notice on every run. Pinning trades that notice for a
# manual bump: this repo stays on 24.04 until someone changes these lines.
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: bgm-looper-lambda

jobs:
  # Everything that gates `deploy` and `release`, in one job. GitHub bills
  # each job rounded up to a whole minute, and this used to be four jobs -
  # lint + unit, Lambda, e2e, Trivy - where the Trivy job ran ~20s and still
  # billed a minute, and two of them paid for their own `npm install`. Split,
  # a run billed ~10 minutes for ~7 of work; together it is ~6. Slower on
  # the wall clock, which is the trade.
  #
  # Every suite records its exit code instead of failing on the spot, so one
  # red suite does not hide the others' results; the last step fails the job.
  #
  # Skipped on a push to dev unless the Lambda is about to deploy: the PR
  # that produced the push already ran this on the same change, and dev's
  # Vercel deploy does not wait for it. A push to dev that touches lambda/
  # still runs it, because `deploy` needs it. stage and main always run it.
  # `!cancelled()` because `changes` only runs on push, and a skipped `needs`
  # would otherwise skip this job on every PR.
  test:
    name: Tests
    needs: changes
    if: >-
      !cancelled() && needs.changes.result != 'failure' && (
        github.event_name != 'push' || github.ref_name != 'dev' ||
        needs.changes.outputs.lambda == 'true'
      )
    runs-on: ubuntu-24.04
    # GitHub's default job timeout is 360 minutes; a hung Playwright server
    # would spend that against the monthly quota.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Free on a private repo: one open-source action, no account, no licence.
      # CodeQL, dependency-review and SARIF upload all need Advanced Security,
      # which this plan does not have, so findings go to the job summary instead
      # of the Security tab. Dependabot alerts (free, already on) cover the rest.
      #
      # `ignore-unfixed`: a CVE with no patched release cannot block an
      # unrelated deploy; the only findings that fail the job are ones a
      # dependency bump would clear. `.trivyignore` at the repo root is the
      # escape hatch for accepted findings - one reason per entry.
      #
      # First, straight after checkout, so it scans the repo and nothing the
      # install steps below put on disk.
      - name: Trivy filesystem scan
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # JSON, not table: the first version counted findings by matching
          # `^(?:Total|Failures): (\d+) \(` over Trivy's ASCII output, which
          # is a presentation detail that differs per scanner type and is
          # absent entirely for a clean target. The JSON also carries
          # PrimaryURL and CauseMetadata.StartLine, which the table drops.
          format: json
          output: trivy-results.json
          # Inert while this step runs before any install or build, since none
          # of these directories exist yet. Kept in case it is ever moved.
          skip-dirs: web/node_modules,web/.next,lambda/.venv
        continue-on-error: true

      - name: Security job summary
        if: always()
        # HEAD_SHA, not github.sha: on a pull_request event github.sha is the
        # synthetic merge commit, and blob links built from it are not
        # reachable from the PR.
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/security-summary.mjs trivy-results.json "${{ steps.trivy.outcome }}"

      # 30 days rather than the 7 used for test results: a scan result is what
      # someone asks about weeks later ("when did this CVE first appear?"), and
      # both files are kilobytes. trivy-summary.md is written by the step above
      # from the same lines it appends to the job summary, so the artifact and
      # the summary cannot disagree.
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results
          path: |
            trivy-results.json
            trivy-summary.md
          retention-days: 30
          overwrite: true
          if-no-files-found: warn

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install app dependencies
        working-directory: web
        run: npm install

      - name: Lint app
        id: lint
        working-directory: web
        run: |
          EXIT_CODE=0
          npm run lint || EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Run app tests
        id: vitest
        working-directory: web
        run: |
          set -o pipefail
          EXIT_CODE=0
          npx vitest run --reporter=default --reporter=json --outputFile.json=vitest-results.json || EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Vitest job summary
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/unit-summary.mjs web/vitest-results.json

      # The summary scripts this workflow depends on.
      - name: Run CI script tests (Node)
        id: node_scripts
        run: |
          EXIT_CODE=0
          node --test ".github/scripts/*.test.mjs" || EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      # Linux only on purpose: the tests need apt ffmpeg and the Lambda ships
      # as a Linux container, so another OS would test a platform it never
      # runs on.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Lambda test dependencies
        working-directory: lambda
        run: pip install -r requirements.txt pytest moto

      - name: Run Lambda tests
        id: pytest
        working-directory: lambda
        run: |
          EXIT_CODE=0
          pytest -v || EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      # The release job's changelog scripts. Cheap, and they are the only thing
      # standing between a bad merge base and issue #168 coming back.
      - name: Run CI script tests (Python)
        id: py_scripts
        run: |
          EXIT_CODE=0
          pytest -q .github/scripts/test_changelog_sync.py || EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run e2e + a11y tests
        id: playwright
        working-directory: web
        run: |
          set -o pipefail
          EXIT_CODE=0
          npx playwright test || EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      # The OS lives in a directory *inside* the zip, not only in the artifact
      # name. `download-artifact` extracts a pattern download flat whenever it
      # matches exactly one artifact (v5+), so the artifact name alone does
      # not survive the round trip - an OS-named directory in the zip does,
      # with `merge-multiple: true` on the other side. `[ -f ]` rather than a
      # bare `cp` so a run that died before the reporter wrote anything leaves
      # `staging` empty and produces no artifact, which is what
      # `if-no-files-found: warn` below expects.
      - name: Stage the Playwright report under its OS
        if: always()
        working-directory: web
        run: |
          mkdir -p "staging/playwright-results-${{ runner.os }}"
          [ -f playwright-results.json ] && cp playwright-results.json "staging/playwright-results-${{ runner.os }}/" || true

      # Read by the `summary` job when the cross-OS legs ran, so it can put all
      # three OSes in one table. `overwrite: true` because uploaded artifacts
      # are immutable and `gh run rerun --failed` - this repo's documented
      # recovery path - would otherwise fail on the retry.
      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ runner.os }}
          path: web/staging
          retention-days: 7
          overwrite: true
          if-no-files-found: warn

      - name: E2E job summary
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/e2e-summary.mjs web/staging

      - name: Fail the job if any suite failed
        if: >-
          steps.trivy.outcome != 'success' ||
          steps.lint.outputs.exit_code != '0' ||
          steps.vitest.outputs.exit_code != '0' ||
          steps.node_scripts.outputs.exit_code != '0' ||
          steps.pytest.outputs.exit_code != '0' ||
          steps.py_scripts.outputs.exit_code != '0' ||
          steps.playwright.outputs.exit_code != '0'
        run: exit 1

  # Windows and macOS e2e, on PRs into main only - the last gate before
  # production, once per release. macOS bills at 10x Linux minutes and
  # Windows at 2x against the free plan's 2,000/month; running these on
  # PRs into stage as well, where every push to dev re-triggers an open
  # promotion PR, cost ~36 minutes a run. Not in `deploy`'s or `release`'s
  # `needs:`: neither runs on a pull_request, so this gates the stage -> main
  # merge as a check, not the release.
  e2e-cross-os:
    name: E2E
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ${{ matrix.os }}
    # One hung macOS leg at 10x could burn the month's quota without this.
    # Measured on run 35361326872: Windows 7m03s, macOS 1m15s.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    # Every step below is bash; windows-latest would otherwise run them in
    # PowerShell, where `set -o pipefail` and `$GITHUB_OUTPUT` do not exist.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install app dependencies
        working-directory: web
        run: npm install

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run e2e + a11y tests
        id: playwright
        working-directory: web
        run: |
          set -o pipefail
          EXIT_CODE=0
          npx playwright test || EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      # Same layout as the test job's upload: see the comments there.
      - name: Stage the Playwright report under its OS
        if: always()
        working-directory: web
        run: |
          mkdir -p "staging/playwright-results-${{ runner.os }}"
          [ -f playwright-results.json ] && cp playwright-results.json "staging/playwright-results-${{ runner.os }}/" || true

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ runner.os }}
          path: web/staging
          retention-days: 7
          overwrite: true
          if-no-files-found: warn

      - name: Fail the job if the e2e suite failed
        if: steps.playwright.outputs.exit_code != '0'
        run: exit 1

  # Visual regression. Parallel to the test jobs, and deliberately absent from every
  # other job's `needs:` - a visual diff must not block a deploy or a release.
  chromatic:
    runs-on: ubuntu-24.04
    # dev is the baseline branch. Promotion PRs (dev -> stage, stage -> main)
    # and stage/main pushes are skipped: their head SHA was already snapshotted
    # on dev, so re-running only spends snapshot budget.
    #
    # Dependabot is excluded because Actions secrets are not exposed to its
    # runs - CHROMATIC_PROJECT_TOKEN would be empty and the job would fail red
    # on every bump. A missing token is an error, not a "change", so
    # exitZeroOnChanges does not absorb it.
    #
    # On a push to dev it also waits for `changes` and runs only when web/ or
    # deploy.yml changed: a docs- or lambda-only push cannot change a story,
    # and the build would still bill a minute and spend snapshot budget.
    # Chromatic finds the baseline for the next build by walking git history,
    # so a skipped commit leaves no gap. PRs are not gated: `changes` does not
    # run on them, and this job already finishes inside the one minute a gate
    # job would bill. `!cancelled()` so the skipped `changes` on a PR does not
    # skip this job too.
    needs: changes
    if: >-
      !cancelled() && github.actor != 'dependabot[bot]' && (
        (github.event_name == 'push' && github.ref_name == 'dev' && needs.changes.outputs.web == 'true') ||
        (github.event_name == 'pull_request' && github.base_ref == 'dev')
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TurboSnap resolves which stories changed from git history and
          # silently falls back to a full build without it.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install app dependencies
        working-directory: web
        run: npm install

      - name: Publish to Chromatic
        uses: chromaui/action@6b3c2820222d23bad770d57a4ad5e2d1c91f92e9 # v18.9.5
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: web
          # TurboSnap: snapshot only the stories the diff can reach.
          onlyChanged: true
          # Advisory gate. This is the action's default, set explicitly: the
          # diff is reviewed through Chromatic's own UI Tests PR check, and CI
          # stays green either way.
          exitZeroOnChanges: true
          # Return as soon as the build is uploaded rather than waiting for the
          # comparison - Chromatic reports the result on its own check.
          exitOnceUploaded: true
          # Required, not tidy: feature PRs are squash-merged into dev, and
          # GitHub squash creates a commit unassociated with the merged branch,
          # so baselines do not carry over on their own.
          autoAcceptChanges: dev

  # Reports, never gates: absent from every other job's `needs:`. Only runs
  # when the cross-OS legs did, because that is the only time there is more
  # than one job's results to put side by side - on every other run the test
  # job's own summary already has them, and this job would bill a minute to
  # repeat it.
  summary:
    name: Summary
    needs: [test, e2e-cross-os, chromatic]
    if: always() && needs.e2e-cross-os.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write the run summary
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: node .github/scripts/run-summary.mjs

      # `continue-on-error` because this job reports and gates nothing: if a
      # leg was cancelled before it uploaded, the right outcome is a summary
      # saying so, not a red job.
      # `merge-multiple: true` extracts every matched zip straight into
      # `e2e-results`; each zip carries its own `playwright-results-<OS>/`
      # directory, so nothing collides.
      - name: Download Playwright results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: playwright-results-*
          merge-multiple: true
          path: e2e-results

      - name: Write the combined e2e summary
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/e2e-summary.mjs e2e-results

  changes:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    outputs:
      lambda: ${{ steps.check.outputs.lambda }}
      web: ${{ steps.check.outputs.web }}
      releasable: ${{ steps.check.outputs.releasable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for lambda changes
        id: check
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "lambda=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "releasable=true" >> "$GITHUB_OUTPUT"
            echo "No previous commit to diff against (new branch or rewritten history) — building to be safe."
            exit 0
          fi
          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- lambda/ .github/workflows/deploy.yml; then
            echo "lambda=false" >> "$GITHUB_OUTPUT"
            echo "No changes under lambda/ or deploy.yml — skipping the Lambda image build."
          else
            echo "lambda=true" >> "$GITHUB_OUTPUT"
          fi
          # Read by `chromatic`: stories live under web/, and deploy.yml
          # configures the job itself.
          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- web/ .github/workflows/deploy.yml; then
            echo "web=false" >> "$GITHUB_OUTPUT"
            echo "No changes under web/ or deploy.yml — skipping Chromatic."
          else
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi
          # A push that touches nothing but CHANGELOG.md must not cut a
          # version. Without this, main's changelog cannot be corrected by
          # hand at all: any push to main satisfies release's condition and
          # BUMP defaults to "patch", so a typo fix ships a release. Hit for
          # real repairing the v1.3.0 heading (#118).
          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- . ':(exclude)CHANGELOG.md'; then
            echo "releasable=false" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG.md is the only change — skipping the release job."
          else
            echo "releasable=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [test, changes]
    runs-on: ubuntu-24.04
    # Required for OIDC: id-token: write is what lets the job mint the token
    # aws-actions/configure-aws-credentials exchanges for the role. Declaring a
    # permissions block replaces the repo default outright rather than adding to
    # it, so contents: read has to be listed too or actions/checkout fails.
    permissions:
      id-token: write
      contents: read
    # A custom `if:` replaces the default `if: success()` entirely, so
    # the test job's success is checked explicitly here rather than assumed.
    # `changes` only runs (and is only needed) on push — on workflow_dispatch
    # it's skipped, and deploy proceeds anyway, ignoring its output.
    # The branch clause exists for workflow_dispatch from a feature branch. The
    # bgm-looper-ci-deploy role's OIDC trust policy is StringEquals on the
    # three permanent branches' refs, so any other branch fails at
    # configure-aws-credentials, and the `case` below has no default arm, so
    # TAG_PREFIX would be empty even if it got that far. Skipping is the
    # honest result; a red deploy on a branch that can never deploy is noise.
    if: always() && contains(fromJSON('["main", "dev", "stage"]'), github.ref_name) && needs.test.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.changes.result == 'success' && needs.changes.outputs.lambda == 'true'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set environment for this branch
        id: env
        run: |
          case "${{ github.ref_name }}" in
            main)  echo "function_name=bgm-looper-processor"       >> "$GITHUB_OUTPUT"; echo "tag_prefix=main"  >> "$GITHUB_OUTPUT" ;;
            dev)   echo "function_name=bgm-looper-processor-dev"   >> "$GITHUB_OUTPUT"; echo "tag_prefix=dev"   >> "$GITHUB_OUTPUT" ;;
            stage) echo "function_name=bgm-looper-processor-stage" >> "$GITHUB_OUTPUT"; echo "tag_prefix=stage" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::223376380711:role/bgm-looper-ci-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Pinned to v2.1.6 rather than floating on @v2, which is v2.1.7. Since
      # @aws-sdk/core 3.977.5 the JSON protocol hands the transport a
      # Uint8Array subclass whose valueOf() decodes to a string and warns,
      # and this action injects its own request handler from the deprecated,
      # frozen @aws-sdk/node-http-handler whose writeBody does
      # Buffer.from(body) -- which recurses through valueOf(). So every login
      # logged "JsonCodec2: you have called a string method on a Uint8Array
      # request body ... In a future version this will throw an error."
      # v2.1.6 bundles @aws-sdk/core 3.974.20, below that threshold, and
      # v2.1.7 was dependency bumps only, so nothing is given up by pinning.
      # Unpin once aws-actions/amazon-ecr-login#1303 ships (see #174).
      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Build, tag, and push image
        working-directory: lambda
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG_PREFIX: ${{ steps.env.outputs.tag_prefix }}
        run: |
          set +e
          TAG="${TAG_PREFIX}-${{ github.sha }}"
          OUT=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" 2>&1)
          RC=$?
          set -e
          if [ $RC -eq 0 ]; then
            echo "Image $TAG already pushed (job retry on the same commit) — skipping build/push. The repo is IMMUTABLE, so re-pushing the same tag would fail."
          elif echo "$OUT" | grep -q "ImageNotFoundException"; then
            docker build -t "$REGISTRY/$ECR_REPOSITORY:$TAG" .
            docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          else
            echo "describe-images failed for an unexpected reason (not \"image not found\"), refusing to guess whether it's safe to push:"
            echo "$OUT"
            exit 1
          fi

      - name: Update Lambda function code
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          FUNCTION_NAME: ${{ steps.env.outputs.function_name }}
          TAG_PREFIX: ${{ steps.env.outputs.tag_prefix }}
        run: |
          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --image-uri "$REGISTRY/$ECR_REPOSITORY:${TAG_PREFIX}-${{ github.sha }}"
          else
            echo "Lambda function $FUNCTION_NAME does not exist yet — skipping update-function-code (expected before its terraform apply has run)."
          fi

  release:
    needs: [test, deploy, changes]
    runs-on: ubuntu-24.04
    # deploy is legitimately skipped (not failed) on a main push that touches
    # no lambda/ files — release must still run in that case, so this can't
    # rely on the default `if: success()` gating, which treats a skipped
    # `needs` job the same as a failed one. The test job's result is checked
    # explicitly too: deploy.result == 'skipped' is ambiguous on its own
    # between "no lambda changes" (fine, release should run) and "the test
    # job failed so deploy's own condition never ran" (must not release).
    #
    # The changes half is split by event_name the same way deploy's is, and
    # for the same reason: `changes` only runs on push, so on
    # workflow_dispatch its result is 'skipped' and its outputs are empty.
    # Testing `releasable != 'false'` would be fail-OPEN — a job-level
    # failure of `changes` leaves the output empty, and '' != 'false', so a
    # runner or checkout failure would cut a release. Testing
    # `== 'true'` alone would be fail-CLOSED but would also kill the
    # workflow_dispatch escape hatch. Branching on the event does both.
    if: always() && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.deploy.result != 'failure' && needs.deploy.result != 'cancelled' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.changes.result == 'success' && needs.changes.outputs.releasable == 'true'))
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"
          else
            COMMITS=$(git log "$LAST_TAG..HEAD" --pretty=format:"%s%n%b")
            BUMP="patch"
            if echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then BUMP="minor"; fi
            if echo "$COMMITS" | grep -qE "^[a-zA-Z]+(\(.+\))?!:|BREAKING CHANGE:"; then BUMP="major"; fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            echo "tag=v$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Update CHANGELOG.md
        id: changelog
        run: |
          set -euo pipefail
          if [ ! -f CHANGELOG.md ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG.md not found, skipping."
            exit 0
          fi
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION="${VERSION#v}"
          DATE=$(date -u +%Y-%m-%d)
          python3 .github/scripts/changelog-release.py CHANGELOG.md "$VERSION" "$DATE"
          # Handed to the sync step, which copies the section this just created
          # on main rather than re-deriving it, so the two cannot disagree.
          # Also what that step keys its `if:` on: it is set whenever a sync is
          # owed, including on a re-run, where `changed` is false.
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git diff --quiet CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit CHANGELOG.md to main
        id: changelog_commit
        if: steps.changelog.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(changelog): release ${{ steps.version.outputs.tag }}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Opens the PR that puts this release's heading back on dev, and does it
      # BEFORE the tag exists. It merges main into a branch off dev instead of
      # cherry-picking the release commit, because #168 proved a copy is not
      # enough: a cherry-pick - or a squash-merge of this PR - leaves the
      # release commit outside dev's history, so the next dev -> stage -> main
      # promotion still has a merge base predating the heading, sees two
      # insertions at the same anchor, and emits the heading twice with the new
      # entries filed under the wrong one. Merging makes the release commit an
      # ancestor of dev, which is what actually retires the conflict class.
      #
      # Every failure below is fatal: this step used to warn and pass, which is
      # why three releases drifted before anyone noticed. Running it before the
      # tag is what makes that safe - a failure here leaves main with the
      # changelog commit and no tag, and re-running the job is the recovery
      # path, so nothing is ever published that has no reconciliation behind
      # it. Every step in that path is idempotent by version, not by date.
      - name: Open changelog-sync PR to dev
        # Not `changed == 'true'`: that is false on a re-run, because main
        # already carries the heading by then. The version output is set
        # whenever CHANGELOG.md exists, which is exactly when a sync is owed.
        if: steps.changelog.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          set -euo pipefail
          # The branch below is cut from dev, whose tree need not carry this
          # script yet, so stash a copy outside the work tree first.
          cp .github/scripts/changelog-sync.py "$RUNNER_TEMP/changelog-sync.py"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin dev main
          BRANCH="chore/changelog-sync-$TAG"
          # A sync PR in any state means an earlier attempt got this far, so
          # this run must not touch the branch: a human may have corrected it,
          # and making their commits unreachable is worse than doing nothing.
          # Checking only `--state open` would miss a PR someone closed while
          # leaving the branch alive, which is the case with commits worth the
          # most.
          # gh's own --jq, so this does not depend on a jq binary being present.
          # The substitution is a separate assignment on purpose: `set -e` takes
          # the exit status of `read`, not of a command substitution feeding its
          # here-string, so folding these two lines together would let a
          # transient gh failure leave PR_STATE empty and fall past the CLOSED
          # arm below into the arm that assumes no PR exists. An empty state is
          # the correct result the first time a tag is synced, so this cannot be
          # a check on PR_STATE after the read.
          PR_JSON=$(gh pr list --head "$BRANCH" --base dev --state all --json state,url --jq '[(.[0].state // ""), (.[0].url // "")] | @tsv')
          IFS=$'	' read -r PR_STATE PR_URL <<< "$PR_JSON"
          case "$PR_STATE" in
            OPEN)
              echo "sync PR for $BRANCH is already open: $PR_URL"
              exit 0
              ;;
            MERGED)
              echo "sync PR for $BRANCH has already merged: $PR_URL"
              exit 0
              ;;
            CLOSED)
              echo "::error::a sync PR for $BRANCH was closed without merging ($PR_URL), so $TAG is not reconciled onto dev and this step will not re-open it or push over the branch. Reopen that PR and merge it, or delete the branch to have the next run rebuild it from scratch."
              exit 1
              ;;
          esac
          git checkout -b "$BRANCH" origin/dev
          git merge --no-ff --no-commit origin/main || true
          OTHER=$(git diff --name-only --diff-filter=U | grep -v '^CHANGELOG\.md$' || true)
          if [ -n "$OTHER" ]; then
            echo "::error::merging main into dev conflicted outside CHANGELOG.md: $(echo "$OTHER" | tr '\n' ' ')"
            exit 1
          fi
          # CHANGELOG.md is resolved by reconstruction, never by git's merge
          # result: two insertions under the same [Unreleased] anchor is the one
          # case git resolves wrongly and silently. The released section is
          # copied from main verbatim, so the two files cannot drift; the only
          # thing added is whatever landed on dev after the promotion, which
          # stays under [Unreleased] instead of being misfiled under a version
          # that did not ship it.
          git show origin/main:CHANGELOG.md > "$RUNNER_TEMP/main-changelog.md"
          git show origin/dev:CHANGELOG.md > "$RUNNER_TEMP/dev-changelog.md"
          python3 "$RUNNER_TEMP/changelog-sync.py" \
            "$RUNNER_TEMP/main-changelog.md" "$RUNNER_TEMP/dev-changelog.md" \
            "$VERSION" CHANGELOG.md | tee "$RUNNER_TEMP/counts.txt"
          KEPT=$(sed -n 's/^kept=//p' "$RUNNER_TEMP/counts.txt")
          MAIN_ONLY=$(sed -n 's/^main_only=//p' "$RUNNER_TEMP/counts.txt")
          git add -A
          if git diff --cached --quiet; then
            echo "dev already carries the $TAG heading and main's history - nothing to sync."
            exit 0
          fi
          # Reaching here with content staged but no MERGE_HEAD means the merge
          # aborted before touching the index - an untracked file main would
          # overwrite, a transient git error, anything the `|| true` above
          # swallowed. The unmerged-paths check cannot see that: there are no
          # unmerged paths when the merge never started. Committing anyway
          # would produce a single-parent commit and hand back exactly the
          # ancestry-less sync #168 is about, silently.
          # The `git merge-base` half exempts the case where dev already
          # contains main - a re-run after the sync PR was merged. There is no
          # MERGE_HEAD then (the merge was a no-op) and no ancestry to lose, so
          # a single-parent commit is fine and the error below would be a wrong
          # diagnosis of a healthy state.
          if ! git rev-parse -q --verify MERGE_HEAD >/dev/null && ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::origin/main was not merged (no MERGE_HEAD) - refusing to open a sync PR whose commit would have one parent."
            exit 1
          fi
          git commit -m "chore(changelog): sync $TAG heading to dev"
          TITLE="chore(changelog): sync $TAG heading to dev"
          if [ "$MAIN_ONLY" != "0" ]; then
            TITLE="$TITLE (main has $MAIN_ONLY entries dev does not)"
          fi
          {
            echo "Automated. Puts the \`$TAG\` heading on dev after the release."
            echo
            if [ "$KEPT" = "0" ]; then
              echo "dev's CHANGELOG.md will be byte-identical to main's once this merges."
            else
              echo "$KEPT entries landed on dev between the promotion and this release, so they did not ship in \`$TAG\`. They have been left under \`## [Unreleased]\` rather than filed under the new heading - nothing to move by hand."
            fi
            if [ "$MAIN_ONLY" != "0" ]; then
              echo
              echo "**$MAIN_ONLY entries are filed under \`$TAG\` on main but were not under dev's \`## [Unreleased]\`.** Either someone committed to main directly, or an entry was reworded on dev after the promotion. Check them before merging."
            fi
            echo
            echo "**Merge this with \`gh pr merge --merge --delete-branch\`, never \`--squash\`.** The branch merges main into dev deliberately; squashing discards that ancestry and re-creates #168, where the next promotion duplicates the version heading and files new entries under it. Merge it promptly, too - until it lands, the promotion-guard job fails every PR into stage and main."
            echo
            echo "It gets CI like any other PR into dev: wait for the test workflow and the release-readiness verdict first."
          } > "$RUNNER_TEMP/pr-body.md"
          # No PR exists for this branch in any state, so if it is on the remote
          # at all, an earlier attempt pushed it and died before `gh pr create`.
          # That branch cannot be fast-forwarded onto: the re-run's commit has a
          # later committer timestamp and so a different SHA even when its
          # content is byte-identical, and a plain push is rejected as
          # non-fast-forward every time, wedging the recovery path this ordering
          # exists to provide. Replace it - but only when its tip is a commit
          # this step made, so anything a human put there fails loudly instead
          # of becoming unreachable.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch --quiet origin "$BRANCH"
            TIP=$(git rev-parse FETCH_HEAD)
            if [ "$(git log -1 --format=%s "$TIP")" = "chore(changelog): sync $TAG heading to dev" ] \
               && [ "$(git log -1 --format=%an "$TIP")" = "github-actions[bot]" ]; then
              echo "$BRANCH is left over from an attempt that died before opening the PR - replacing it."
              git push --force origin "$BRANCH"
            else
              echo "::error::$BRANCH exists on the remote with no pull request, and its tip $TIP (\"$(git log -1 --format=%s "$TIP")\" by $(git log -1 --format=%an "$TIP")) is not a commit this step created. Refusing to overwrite it. Inspect that branch, then delete it to let a re-run rebuild the sync from scratch."
              exit 1
            fi
          else
            git push origin "$BRANCH"
          fi
          gh pr create --base dev --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"

      # Last, and only once the sync PR above exists. Idempotent so the re-run
      # that recovers a failed sync does not trip over its own earlier release.
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released - nothing to do."
            exit 0
          fi
          gh release create "$TAG" --target main --generate-notes

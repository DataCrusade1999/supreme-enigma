version: 2

# Targets the default branch (dev), so updates enter the normal
# dev -> stage -> main promotion flow rather than landing on main directly.
# `commit-message.prefix` is not cosmetic: deploy.yml's release job derives
# the version bump from Conventional Commit prefixes, so Dependabot's default
# "Bump X from A to B" subject would not parse.
#
# Each ecosystem groups its minor and patch bumps into one PR. Separate PRs
# conflict on the shared lock file, so merging one makes Dependabot rebase the
# rest and every rebase is another CI run. Majors stay ungrouped so a breaking
# one cannot hold up the batch. Terraform still opens one PR per directory:
# groups do not span `directories` (`group-by: dependency-name` would, but
# only as one PR per dependency).
#
# Monthly, not weekly: each grouped PR is a full CI run, and the Dependabot
# job that opens them is billed against the same 2,000 Actions minutes.
# A fixable HIGH/CRITICAL CVE does not wait for the month: Trivy in the
# test job fails CI on it, and Dependabot alerts are on.
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # typescript-eslint (via eslint-config-next) declares
      # `typescript: >=4.8.4 <6.1.0`; on TS 7 it throws at config-load time and
      # `npm run lint` exits 2 without linting anything. Unignore once
      # typescript-eslint ships TS 7 support (typescript-eslint#10940).
      - dependency-name: typescript
        versions: [">=6"]

  - package-ecosystem: pip
    directory: /lambda
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      pip:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # amazon-ecr-login v2.1.7 bundles @aws-sdk/core 3.977.8, and from 3.977.5
      # the JSON protocol hands the transport a Uint8Array subclass whose
      # valueOf() decodes to a string and warns. The action's own injected
      # request handler, from the deprecated @aws-sdk/node-http-handler, does
      # Buffer.from(body) and so trips it on every login. Unignore once
      # aws-actions/amazon-ecr-login#1303 ships (see #174).
      - dependency-name: aws-actions/amazon-ecr-login
        versions: [">2.1.6"]

  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/main
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      terraform:
        patterns: ["*"]
        update-types: [minor, patch]

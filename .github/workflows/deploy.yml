name: CI/CD

on:
  push:
    branches: [main, dev, stage]
  pull_request:
    branches: [dev, stage, main]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: bgm-looper-lambda

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Lambda test dependencies
        working-directory: lambda
        run: pip install -r requirements.txt pytest moto

      - name: Run Lambda tests
        working-directory: lambda
        run: pytest -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install app dependencies
        working-directory: app
        run: npm install

      - name: Run app tests
        working-directory: app
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set environment for this branch
        id: env
        run: |
          case "${{ github.ref_name }}" in
            main)  echo "function_name=bgm-looper-processor"       >> "$GITHUB_OUTPUT"; echo "tag_prefix=main"  >> "$GITHUB_OUTPUT" ;;
            dev)   echo "function_name=bgm-looper-processor-dev"   >> "$GITHUB_OUTPUT"; echo "tag_prefix=dev"   >> "$GITHUB_OUTPUT" ;;
            stage) echo "function_name=bgm-looper-processor-stage" >> "$GITHUB_OUTPUT"; echo "tag_prefix=stage" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_CI_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_CI_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        working-directory: lambda
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG_PREFIX: ${{ steps.env.outputs.tag_prefix }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:${TAG_PREFIX}-${{ github.sha }}" .
          docker push "$REGISTRY/$ECR_REPOSITORY:${TAG_PREFIX}-${{ github.sha }}"
          if [ "$TAG_PREFIX" = "main" ]; then
            docker tag "$REGISTRY/$ECR_REPOSITORY:${TAG_PREFIX}-${{ github.sha }}" "$REGISTRY/$ECR_REPOSITORY:latest"
            docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          fi

      - name: Update Lambda function code
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          FUNCTION_NAME: ${{ steps.env.outputs.function_name }}
          TAG_PREFIX: ${{ steps.env.outputs.tag_prefix }}
        run: |
          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --image-uri "$REGISTRY/$ECR_REPOSITORY:${TAG_PREFIX}-${{ github.sha }}"
          else
            echo "Lambda function $FUNCTION_NAME does not exist yet — skipping update-function-code (expected before its terraform apply has run)."
          fi

  release:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"
          else
            COMMITS=$(git log "$LAST_TAG..HEAD" --pretty=format:"%s%n%b")
            BUMP="patch"
            if echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then BUMP="minor"; fi
            if echo "$COMMITS" | grep -qE "^[a-zA-Z]+(\(.+\))?!:|BREAKING CHANGE:"; then BUMP="major"; fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            echo "tag=v$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.version.outputs.tag }}" --target main --generate-notes
